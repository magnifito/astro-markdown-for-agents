# Match common AI Agent User-Agents (similar to the Cloudflare list)
map $http_user_agent $is_agent {
    default 0;
    "~*anthropic-ai|Claude-Web|ClaudeBot|GPTBot|ChatGPT-User|Google-Extended|cohere-ai|PerplexityBot|YouBot|Applebot-Extended|Bytespider|CCBot|DataForSeoBot|FacebookBot|facebookexternalhit|ImagesiftBot|Omgilibot|Omgili|PiplBot|Seekr|Timpibot|VelenPublicWebCrawler|WebzIO-Extended" 1;
}

# Match Accept header
map $http_accept $wants_markdown {
    default 0;
    "~*text/markdown" 1;
}

# Combine conditions: if either is true, serve markdown
map "$is_agent$wants_markdown" $serve_markdown {
    default 0;
    "~1" 1;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    location / {
        # If the request comes from an AI agent or requests text/markdown
        if ($serve_markdown = 1) {
            # Change the internal content type so it's sent as text/markdown
            # Nginx `add_header` won't override default without more complex config,
            # but we can try serving the .md file directly with a specific types block.
            rewrite ^/(.*)$ /markdown_handler/$1 last;
        }

        # Normal HTML fallback
        try_files $uri $uri/index.html =404;
    }

    location /markdown_handler/ {
        internal;
        
        # Override Types to ensure .md files are sent as text/markdown
        types {
            text/markdown md;
        }
        default_type text/markdown;

        # Try to find the Markdown file for the corresponding HTML route
        # e.g., / -> index.md, /about -> about/index.md or about.md
        
        # Strip the /markdown_handler/ prefix
        rewrite ^/markdown_handler/(.*)$ /$1 break;
        
        try_files $uri.md $uri/index.md $uri/index.md/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
